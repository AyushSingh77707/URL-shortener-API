services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: url-shortener-redis
          type: redis
          property: host
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 5
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 1
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SECRET_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

databases:
  - name: url-shortener-db
    plan: free

  - name: url-shortener-redis
    plan: free